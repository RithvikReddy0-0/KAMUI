# KAMUI small configuration
# Purpose: primary development and interpretability research config
# Use case: training the model used for all interpretability experiments
#
# Parameter count: ~12M
# Training time: ~2 hours on a single T4 GPU (TinyStories, 5000 steps)
# Expected val perplexity: ~8–12 on TinyStories

model:
  n_layers: 6
  d_model: 256
  n_heads: 8             # d_head = 32
  d_ff: 1024             # 4 * d_model
  vocab_size: 8192
  context_length: 256
  positional_encoding: "learned"
  dropout: 0.0

training:
  batch_size: 32
  grad_accum_steps: 4    # effective batch = 128
  max_steps: 5000
  learning_rate: 3.0e-4
  min_lr: 3.0e-5
  warmup_steps: 200
  grad_clip: 1.0
  weight_decay: 0.1
  betas: [0.9, 0.95]
  eval_interval: 250
  checkpoint_interval: 1000
  mixed_precision: true  # fp16 forward/backward, fp32 optimiser step

data:
  dataset: "tinystories"
  train_split: 0.95
  seed: 42

logging:
  log_interval: 100
  output_dir: "checkpoints/small"
