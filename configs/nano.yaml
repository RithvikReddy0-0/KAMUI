# KAMUI nano configuration
# Purpose: fast iteration and debugging — runs on CPU in minutes
# Use case: unit testing, CI, first-time setup verification
#
# Parameter count: ~1.5M
# Training time: ~10 min on a single T4 GPU (TinyShakespeare, 2000 steps)

model:
  n_layers: 4
  d_model: 128
  n_heads: 4             # d_head = 32
  d_ff: 512              # 4 * d_model
  vocab_size: 4096
  context_length: 128
  positional_encoding: "learned"   # or "sinusoidal"
  dropout: 0.0

training:
  batch_size: 16
  grad_accum_steps: 1    # effective batch = batch_size * grad_accum_steps = 16
  max_steps: 2000
  learning_rate: 3.0e-4
  min_lr: 3.0e-5         # 10% of learning_rate
  warmup_steps: 100
  grad_clip: 1.0
  weight_decay: 0.1
  betas: [0.9, 0.95]
  eval_interval: 200
  checkpoint_interval: 500
  mixed_precision: false  # keep false for CPU runs

data:
  dataset: "tinystories"
  train_split: 0.95
  seed: 42

logging:
  log_interval: 50
  output_dir: "checkpoints/nano"
