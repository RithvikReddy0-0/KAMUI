name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-docs:
    name: Build & deploy documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for mkdocs git-revision-date plugin

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package + docs dependencies
        run: pip install -e ".[dev]"

      - name: Build (strict — fail on any missing page or broken link)
        run: mkdocs build --strict

      - name: Deploy
        run: mkdocs gh-deploy --force
